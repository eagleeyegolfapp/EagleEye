# Sole automatic publisher. Mac can be asleep or off.
# Secrets: Settings → Secrets → Actions (LATE_API_KEY, XAI_API_KEY).
# This job loads slots into Late. Late publishes at the Eastern time.
name: EagleEye social

on:
  schedule:
    # 4:00 AM ET — load today's slots well before 06:00
    - cron: "0 8 * * *"
    # 5:30 AM ET — backup if the 4am job was delayed
    - cron: "30 9 * * *"
    # 7:00 AM ET — catch-up anything missed
    - cron: "0 11 * * *"
    # 10:00 PM ET — load tomorrow's 06:00 while Late is awake
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "auto, news, or community"
        required: false
        default: "auto"
        type: choice
        options: [auto, news, community]
      when:
        description: 'Eastern "YYYY-MM-DD HH:MM" (empty = remaining today)'
        required: false
        default: ""
        type: string
  # First push of this file starts a run so GitHub actually registers the cron.
  push:
    branches: [main]
    paths:
      - ".github/workflows/eagleeye-social.yml"
      - "automation/**"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore rotation state
        uses: actions/cache@v4
        with:
          path: automation/state
          key: eagleeye-state-${{ github.run_id }}
          restore-keys: |
            eagleeye-state-
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run → Late
        env:
          LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: eagleeyegolfapp@gmail.com
          KIND: ${{ github.event.inputs.kind || 'auto' }}
          WHEN: ${{ github.event.inputs.when || '' }}
          LIVE: "true"
          TZ: America/New_York
          PYTHONUNBUFFERED: "1"
        run: python3 -u run_daily.py --live
