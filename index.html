<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EagleEye</title>
  <meta name="description" content="EagleEye — personal golf scoring and stats." />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0c0d0f;
      --fg: #f2efe6;
      --muted: #a39e90;
      --accent: #d4b347;
      --border: #2a2d33;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f4ee;
        --fg: #1a1b1e;
        --muted: #5c584e;
        --accent: #9a7b1f;
        --border: #e2ddd0;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.85rem;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { color: var(--muted); }
    a { color: var(--accent); }
    nav {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    nav a {
      margin-right: 1rem;
      font-weight: 600;
      text-decoration: none;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>EagleEye</h1>
    <p>Personal golf scoring, GPS flyovers, and stats on your iPhone. Data stays on your device. No subscriptions, no ads.</p>
    <nav>
      <a href="https://apps.apple.com/app/id6793305657">App Store</a>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
    <p style="margin-top:2rem;font-size:0.95rem">
      Contact:
      <a href="mailto:eagleeyegolfapp@gmail.com">eagleeyegolfapp@gmail.com</a>
    </p>
  </main>
</body>
</html>
